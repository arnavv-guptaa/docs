<!-- Parallax square icon (mark only, no wordmark). DERIVED 2026-10-04 from parallax-logo-colored-outlined.svg (locked 2026-09-30): same six polygons and gradients, unchanged; only the canvas is square with padding. PROPOSAL: not part of the lock until Ben approves. -->
